<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>b.k.h</title>
<meta name="description" content="ödeme takip">
<meta name="theme-color" content="#1b1e25">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="b.k.h">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#1b1e25; --panel:#242832; --line:#333949; --txt:#dfe3ea; --mut:#8c94a5;
  --accent:#8fb3a0; --accent2:#8fa8c4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color-scheme:dark}
body{margin:0;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);text-transform:lowercase;min-height:100vh;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
input,button,select{font:inherit;color:inherit;text-transform:lowercase}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
.hidden{display:none!important}

/* sezon renkleri */
.kis{--c:#7d9bb8;--c2:#27364a;--cl:#bcd3e8}
.ilk{--c:#84ad8f;--c2:#263a2d;--cl:#c3e3cb}
.yaz{--c:#d4b078;--c2:#40372a;--cl:#f1dcb0}
.son{--c:#c58a68;--c2:#43302a;--cl:#efc3a7}

/* üst sabit alan */
#top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 0 10px}
h1{margin:2px 0 10px;text-align:center;font-size:25px;font-weight:600;letter-spacing:.06em;color:#e6dcc3}
.in{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;outline:none;min-height:46px}
.in:focus{border-color:var(--accent2)}
.row2{display:flex;gap:8px;margin-top:8px}
.row2 .in{flex:1;min-width:0}
.btn{border:0;border-radius:14px;padding:0 22px;min-height:46px;background:var(--accent);color:#15181e;font-weight:600}
.btn:active{filter:brightness(.92)}
.chips{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 13px;font-size:14px;color:var(--mut)}
.chip.on{color:#15181e;border-color:transparent}
.chip.on.market,.cat.market{--k:#8fb3a0}
.chip.on.fatura,.cat.fatura{--k:#8fa8c4}
.chip.on.ihtiyaç,.cat.ihtiyaç{--k:#b39fc9}
.chip.on.diğer,.cat.diğer{--k:#9aa1ad}
.chip.on{background:var(--k)}
#msg{min-height:18px;margin:7px 0 0;text-align:center;font-size:13px;color:var(--mut)}
#msg.err{color:#d99a8e}

/* yıl */
#yearbar{display:flex;justify-content:center;align-items:center;gap:16px;margin:18px 0 6px}
#yearbar button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:18px;line-height:1}
#year{font-size:20px;font-weight:600;min-width:64px;text-align:center;letter-spacing:.05em}

/* aylar */
.season{margin:16px 0}
.sname{text-align:center;font-size:12px;letter-spacing:.14em;color:var(--c);margin-bottom:8px}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.mcard{position:relative;width:calc((100% - 20px)/3);min-width:96px;height:88px;border-radius:18px;background:var(--c);color:#1b1e25;overflow:hidden;transition:background .7s ease var(--d,0ms),color .7s ease var(--d,0ms);box-shadow:0 2px 10px rgba(0,0,0,.25)}
body.t .mcard{background:var(--c2);color:var(--cl)}
.mcard.cur{outline:2px solid rgba(255,255,255,.3);outline-offset:2px}
.mmain{position:absolute;left:0;right:0;top:0;bottom:28px;background:none;border:0;display:grid;place-items:center;padding:0 4px;color:inherit}
.face{grid-area:1/1;font-weight:600;transition:opacity .55s ease var(--d,0ms),transform .55s ease var(--d,0ms);white-space:nowrap}
.face.name{font-size:20px}
.face.total{font-size:16px;opacity:0;transform:translateY(16px)}
body.t .face.name{opacity:0;transform:translateY(-16px)}
body.t .face.total{opacity:1;transform:none}
.pen{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:36px;height:20px;border:0;border-radius:10px;background:rgba(0,0,0,.16);color:inherit;display:grid;place-items:center;padding:0}
.empty{text-align:center;color:var(--mut);margin:44px 0}

/* liste penceresi */
.ov{position:fixed;inset:0;background:rgba(10,12,16,.65);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;backdrop-filter:blur(3px)}
.ov.on{display:flex}
.sheet{position:relative;width:100%;max-width:440px;max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px 16px 16px}
.sheet h2{margin:0 0 12px;text-align:center;font-size:21px;font-weight:600;color:var(--c,var(--txt))}
.x{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.06);font-size:20px;line-height:1}
.sum{display:flex;justify-content:space-around;text-align:center;margin-bottom:6px}
.sum div{display:flex;flex-direction:column}
.sum b{font-size:15px;font-weight:600}
.sum span{font-size:11px;color:var(--mut);letter-spacing:.08em}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;margin:8px 0;background:hsla(var(--h),60%,65%,.10);border-left:4px solid hsl(var(--h),62%,66%);transition:opacity .2s}
.row.paid{opacity:.5}
.row.paid .d{text-decoration:line-through}
.row .mid{flex:1;min-width:0}
.d{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:12px;color:var(--mut);display:flex;gap:8px;align-items:center;margin-top:2px}
.cat{font-size:11px;padding:1px 8px;border-radius:999px;color:var(--k);background:rgba(255,255,255,.05)}
.amt{font-weight:600;white-space:nowrap;color:hsl(var(--h),70%,73%)}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--mut);background:transparent;display:grid;place-items:center;padding:0;color:transparent;flex:none}
.chk.on{background:var(--accent);border-color:var(--accent);color:#15181e}
.ib{width:32px;height:32px;border-radius:10px;border:0;background:rgba(255,255,255,.07);display:grid;place-items:center;padding:0;flex:none}
.foot{display:flex;justify-content:center;margin-top:10px}
.ghost{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 16px;font-size:14px;display:inline-flex;align-items:center;gap:7px}

/* düzenleme penceresi */
#ed .sheet{max-width:380px}
#ed label{display:block;font-size:12px;color:var(--mut);margin:12px 0 5px;letter-spacing:.06em}
#ed .btns{display:flex;gap:8px;margin-top:16px}
#ed .btns button{flex:1;min-height:44px;border-radius:12px;border:0;font-weight:600}
.b-save{background:var(--accent);color:#15181e}
.b-del{background:#6b3f3a;color:#f1c9c2}
.b-no{background:rgba(255,255,255,.08)}

/* giriş */
#login{text-align:center;padding-top:20vh}
#login h1{font-size:44px}
#login p{color:var(--mut)}
.gbtn{margin-top:18px;min-height:50px;padding:0 26px}
#lmsg{color:#d99a8e;font-size:13px;margin-top:14px;min-height:18px}

.foot2{margin-top:36px;text-align:center;font-size:12px;color:var(--mut)}
.foot2 button{background:none;border:0;color:var(--mut);text-decoration:underline;font-size:12px;padding:4px 8px}
</style>
</head>
<body>

<!-- giriş ekranı -->
<main id="login" class="wrap hidden">
  <h1>b.k.h</h1>
  <p>benim küçük hatırlatıcım</p>
  <button class="btn gbtn" data-act="login">google ile giriş yap</button>
  <div id="lmsg"></div>
</main>

<!-- uygulama -->
<div id="app" class="hidden">
  <header id="top">
    <div class="wrap">
      <h1>b.k.h</h1>
      <form id="addForm" autocomplete="off">
        <input class="in" id="txt" placeholder="500tl telefon faturası" autocomplete="off" autocapitalize="none" enterkeyhint="done">
        <div class="row2">
          <input class="in" type="date" id="dt">
          <button class="btn" type="submit">ekle</button>
        </div>
        <div class="chips" id="chips"></div>
      </form>
      <p id="msg">kategori seçmezsen otomatik bulunur</p>
    </div>
  </header>

  <main class="wrap">
    <div id="yearbar">
      <button data-act="yprev" aria-label="önceki yıl">‹</button>
      <div id="year"></div>
      <button data-act="ynext" aria-label="sonraki yıl">›</button>
    </div>
    <div id="months"></div>
    <div class="foot2"><span id="who"></span> <button data-act="logout">çıkış</button></div>
  </main>
</div>

<!-- ay listesi -->
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<!-- düzenle -->
<div class="ov" id="ed">
  <div class="sheet">
    <button class="x" data-act="edclose" aria-label="kapat">×</button>
    <h2>düzenle</h2>
    <label>açıklama</label>
    <input class="in" id="e-desc" autocapitalize="none">
    <label>tutar (tl)</label>
    <input class="in" id="e-amt" inputmode="decimal">
    <label>tarih</label>
    <input class="in" type="date" id="e-date">
    <label>kategori</label>
    <div class="chips" id="e-chips" style="justify-content:flex-start;margin-top:0"></div>
    <p id="e-msg" style="color:#d99a8e;font-size:13px;min-height:18px;margin:10px 0 0"></p>
    <div class="btns">
      <button class="b-del" data-act="edel">sil</button>
      <button class="b-no" data-act="edclose">vazgeç</button>
      <button class="b-save" data-act="esave">kaydet</button>
    </div>
  </div>
</div>

<script type="module">
/* ============ firebase ayarı ============
   firebase console > proje ayarları > uygulamanız > web uygulaması > config
   değerleri aşağıya yapıştır. "BURAYA" kalırsa deneme modu çalışır (veri sadece bu cihazda). */
const firebaseConfig = {
  apiKey: "AIzaSyB059oCiWYMYsJeiPwvrjzAA1HBK3S0JI4",
  authDomain: "bkh1-50fc1.firebaseapp.com",
  projectId: "bkh1-50fc1",
  storageBucket: "bkh1-50fc1.firebasestorage.app",
  messagingSenderId: "347806369154",
  appId: "1:347806369154:web:04bb880ffa3991de13bb9b"
};
const LOCAL = firebaseConfig.apiKey === "BURAYA";
const FB = "https://www.gstatic.com/firebasejs/11.0.2/";

const TR_MONTHS=['ocak','şubat','mart','nisan','mayıs','haziran','temmuz','ağustos','eylül','ekim','kasım','aralık'];
const SEASONS=[
  {id:'kis',name:'kış',months:[0,1,11]},
  {id:'ilk',name:'ilkbahar',months:[2,3,4]},
  {id:'yaz',name:'yaz',months:[5,6,7]},
  {id:'son',name:'sonbahar',months:[8,9,10]}
];
const CATS=['market','fatura','ihtiyaç','diğer'];
const PEN='<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>';
const CHECK='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>';

// <pure>
function parseAmount(raw){
  raw=String(raw).trim().replace(/[.,]+$/,'');
  if(!/^\d[\d.,]*$/.test(raw)) return null;
  let n;
  if(raw.includes('.')&&raw.includes(',')){
    if(raw.lastIndexOf(',')>raw.lastIndexOf('.')) n=raw.replace(/\./g,'').replace(',','.');
    else n=raw.replace(/,/g,'');
  }else if(raw.includes(',')){
    n=raw.replace(',','.');
  }else if(raw.includes('.')){
    n=/^\d{1,3}(\.\d{3})+$/.test(raw)?raw.replace(/\./g,''):raw;
  }else n=raw;
  const v=parseFloat(n);
  return isFinite(v)&&v>0?v:null;
}
function parseEntry(s){
  const m=s.match(/(\d[\d.,]*)\s*(?:tl|₺|lira)?/i);
  if(!m) return null;
  const amount=parseAmount(m[1]);
  if(amount==null) return null;
  const desc=(s.slice(0,m.index)+' '+s.slice(m.index+m[0].length)).replace(/\s+/g,' ').trim();
  return {amount,desc:desc||'ödeme'};
}
const KW={
  fatura:['fatura','elektrik','doğalgaz','internet','telefon','aidat','kira','abonelik','netflix','kredi','taksit','vergi','sigorta','su','gaz'],
  market:['market','bim','a101','şok','migros','manav','kasap','bakkal','ekmek','süt','yiyecek','pazar','fırın'],
  ihtiyaç:['ilaç','eczane','benzin','yakıt','mazot','okul','kırtasiye','giyim','çocuk','temizlik','berber','kuaför','tamir','bakım','ihtiyaç']
};
function detectCat(desc){
  const toks=desc.toLocaleLowerCase('tr').split(/[^\p{L}\d]+/u).filter(Boolean);
  for(const c of ['fatura','market','ihtiyaç']){
    for(const k of KW[c]){
      if(toks.some(t=>t===k||(k.length>3&&t.startsWith(k)))) return c;
    }
  }
  return 'diğer';
}
// </pure>

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const money=n=>n.toLocaleString('tr-TR',{maximumFractionDigits:2})+' tl';
const seasonOf=m=>SEASONS.find(s=>s.months.includes(m));

const state={year:new Date().getFullYear(),cat:null,open:null,edit:false,editing:null,ecat:'diğer'};
let items=[];
let store=null;
let unsub=null;

function enrich(r){
  const [y,m,d]=String(r.date||'').split('-').map(Number);
  if(!y||!m||!d) return null;
  return {...r,y,m:m-1,d,amount:Number(r.amount)||0,paid:!!r.paid,cat:CATS.includes(r.cat)?r.cat:'diğer',desc:r.desc||'ödeme'};
}
function setItems(arr){
  items=arr.map(enrich).filter(Boolean);
  renderAll();
}
const monthItems=(y,m)=>items.filter(i=>i.y===y&&i.m===m);

function setMsg(t,err){const el=$('#msg');el.textContent=t;el.classList.toggle('err',!!err)}

/* ---------- çizim ---------- */
function chipsHtml(sel,act){
  return CATS.map(c=>`<button type="button" class="chip ${c}${sel===c?' on':''}" data-act="${act}" data-cat="${c}">${c}</button>`).join('');
}
function renderChips(){ $('#chips').innerHTML=chipsHtml(state.cat,'cat'); }

function renderMonths(){
  $('#year').textContent=state.year;
  const now=new Date();
  let html='',idx=0;
  for(const s of SEASONS){
    const ms=s.months.slice().sort((a,b)=>a-b).filter(m=>monthItems(state.year,m).length);
    if(!ms.length) continue;
    html+=`<section class="season ${s.id}"><div class="sname">${s.name}</div><div class="grid">`;
    for(const m of ms){
      const tot=monthItems(state.year,m).reduce((a,i)=>a+i.amount,0);
      const cur=state.year===now.getFullYear()&&m===now.getMonth();
      html+=`<div class="mcard${cur?' cur':''}" style="--d:${(idx++)*90}ms">
        <button class="mmain" data-act="open" data-m="${m}"><span class="face name">${TR_MONTHS[m]}</span><span class="face total">${money(tot)}</span></button>
        <button class="pen" data-act="pen" data-m="${m}" aria-label="düzenle">${PEN}</button>
      </div>`;
    }
    html+='</div></section>';
  }
  $('#months').innerHTML=html||`<p class="empty">${items.length?'bu yılda ödeme yok':'henüz ödeme yok.<br>yukarıdan ilk ödemeni ekle'}</p>`;
}

function renderPanel(){
  const ov=$('#ov'),o=state.open;
  if(!o){ov.classList.remove('on');return}
  const list=monthItems(o.y,o.m).sort((a,b)=>b.amount-a.amount);
  if(!list.length){state.open=null;ov.classList.remove('on');return}
  const max=list[0].amount,min=list[list.length-1].amount;
  const tot=list.reduce((a,i)=>a+i.amount,0);
  const paid=list.filter(i=>i.paid).reduce((a,i)=>a+i.amount,0);
  const sheet=$('#sheet');
  sheet.className='sheet '+seasonOf(o.m).id;
  sheet.innerHTML=`<button class="x" data-act="close" aria-label="kapat">×</button>
    <h2>${TR_MONTHS[o.m]} ${o.y}</h2>
    <div class="sum"><div><b>${money(tot)}</b><span>toplam</span></div><div><b>${money(paid)}</b><span>ödenen</span></div><div><b>${money(tot-paid)}</b><span>kalan</span></div></div>
    ${list.map(it=>{
      const t=max===min?0.5:(it.amount-min)/(max-min);
      const h=Math.round(52*(1-t));
      return `<div class="row${it.paid?' paid':''}" style="--h:${h}">
        <button class="chk${it.paid?' on':''}" data-act="paid" data-id="${esc(it.id)}" aria-label="ödendi">${CHECK}</button>
        <div class="mid"><div class="d">${esc(it.desc)}</div><div class="meta"><span class="cat ${it.cat}">${it.cat}</span>${it.d} ${TR_MONTHS[it.m]}</div></div>
        <div class="amt">${money(it.amount)}</div>
        ${state.edit?`<button class="ib" data-act="edit" data-id="${esc(it.id)}" aria-label="düzenle">${PEN}</button>`:''}
      </div>`;
    }).join('')}
    <div class="foot"><button class="ghost" data-act="toggleedit">${PEN} ${state.edit?'bitti':'düzenle'}</button></div>`;
  ov.classList.add('on');
}
function renderAll(){renderMonths();renderPanel()}

/* ---------- işlemler ---------- */
function addEntry(e){
  e.preventDefault();
  const p=parseEntry($('#txt').value.trim());
  if(!p){setMsg('tutar bulunamadı. örnek: 500tl telefon faturası',true);return}
  const date=$('#dt').value||todayStr();
  const cat=state.cat||detectCat(p.desc);
  store.add({desc:p.desc.toLocaleLowerCase('tr'),amount:p.amount,date,cat,paid:false});
  const [y,m]=date.split('-').map(Number);
  state.year=y;
  setMsg(`eklendi → ${TR_MONTHS[m-1]} ${y} · ${cat}`);
  $('#txt').value='';
  $('#dt').value=todayStr();
  state.cat=null;
  renderChips();
  renderAll();
}

function openEdit(id){
  const it=items.find(i=>i.id===id); if(!it) return;
  state.editing=id; state.ecat=it.cat;
  $('#e-desc').value=it.desc;
  $('#e-amt').value=String(it.amount).replace('.',',');
  $('#e-date').value=it.date;
  $('#e-chips').innerHTML=chipsHtml(state.ecat,'ecat');
  $('#e-msg').textContent='';
  $('#ed').classList.add('on');
}
function saveEdit(){
  const amt=parseAmount($('#e-amt').value);
  if(amt==null){$('#e-msg').textContent='geçerli bir tutar gir';return}
  const date=$('#e-date').value;
  if(!date){$('#e-msg').textContent='tarih seç';return}
  const desc=($('#e-desc').value.trim()||'ödeme').toLocaleLowerCase('tr');
  store.update(state.editing,{desc,amount:amt,date,cat:state.ecat});
  $('#ed').classList.remove('on');
}

document.addEventListener('click',e=>{
  if(e.target.id==='ov'){state.open=null;renderPanel();return}
  if(e.target.id==='ed'){$('#ed').classList.remove('on');return}
  const t=e.target.closest('[data-act]'); if(!t) return;
  const a=t.dataset.act;
  if(a==='cat'){state.cat=state.cat===t.dataset.cat?null:t.dataset.cat;renderChips()}
  else if(a==='ecat'){state.ecat=t.dataset.cat;$('#e-chips').innerHTML=chipsHtml(state.ecat,'ecat')}
  else if(a==='yprev'){state.year--;renderAll()}
  else if(a==='ynext'){state.year++;renderAll()}
  else if(a==='open'){state.open={y:state.year,m:+t.dataset.m};state.edit=false;renderPanel()}
  else if(a==='pen'){state.open={y:state.year,m:+t.dataset.m};state.edit=true;renderPanel()}
  else if(a==='close'){state.open=null;renderPanel()}
  else if(a==='toggleedit'){state.edit=!state.edit;renderPanel()}
  else if(a==='paid'){const it=items.find(i=>i.id===t.dataset.id);if(it)store.update(it.id,{paid:!it.paid})}
  else if(a==='edit'){openEdit(t.dataset.id)}
  else if(a==='edclose'){$('#ed').classList.remove('on')}
  else if(a==='esave'){saveEdit()}
  else if(a==='edel'){
    if(confirm('bu ödemeyi silmek istediğine emin misin?')){store.remove(state.editing);$('#ed').classList.remove('on')}
  }
  else if(a==='login'){doLogin()}
  else if(a==='logout'){doLogout()}
});

/* ---------- depolama ---------- */
function makeLocalStore(){
  const KEY='bkh_items_v1';
  let arr=[];
  try{arr=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(_){}
  let cb=()=>{};
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(arr))}catch(_){} cb(arr.slice())};
  return {
    start(f){cb=f;cb(arr.slice());return()=>{}},
    add(o){arr.push({...o,id:Date.now().toString(36)+Math.random().toString(36).slice(2,7)});save()},
    update(id,o){arr=arr.map(x=>x.id===id?{...x,...o}:x);save()},
    remove(id){arr=arr.filter(x=>x.id!==id);save()}
  };
}

let auth=null,fb={};
async function boot(){
  $('#dt').value=todayStr();
  renderChips();
  if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}

  if(LOCAL){
    store=makeLocalStore();
    $('#who').textContent='deneme modu · veriler sadece bu cihazda';
    showApp();
    return;
  }
  try{
    const [A,F,S]=await Promise.all([import(FB+'firebase-app.js'),import(FB+'firebase-auth.js'),import(FB+'firebase-firestore.js')]);
    fb={...A,...F,...S};
    const app=fb.initializeApp(firebaseConfig);
    auth=fb.getAuth(app);
    let db;
    try{db=fb.initializeFirestore(app,{localCache:fb.persistentLocalCache({tabManager:fb.persistentMultipleTabManager()})})}
    catch(_){db=fb.getFirestore(app)}
    fb.db=db;
    fb.onAuthStateChanged(auth,user=>{
      if(unsub){unsub();unsub=null}
      if(user){
        const col=fb.collection(db,'users',user.uid,'payments');
        const fail=err=>setMsg('kaydedilemedi: '+(err&&err.code||'hata'),true);
        store={
          start(cb){return fb.onSnapshot(col,snap=>cb(snap.docs.map(d=>({id:d.id,...d.data()}))),fail)},
          add(o){fb.addDoc(col,{...o,createdAt:fb.serverTimestamp()}).catch(fail)},
          update(id,o){fb.updateDoc(fb.doc(db,'users',user.uid,'payments',id),o).catch(fail)},
          remove(id){fb.deleteDoc(fb.doc(db,'users',user.uid,'payments',id)).catch(fail)}
        };
        $('#who').textContent=user.email||'';
        showApp();
      }else{
        items=[];store=null;
        $('#app').classList.add('hidden');
        $('#login').classList.remove('hidden');
      }
    });
  }catch(err){
    $('#login').classList.remove('hidden');
    $('#lmsg').textContent='bağlantı kurulamadı, internetini kontrol et';
  }
}
function showApp(){
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  unsub=store.start(setItems);
}
async function doLogin(){
  $('#lmsg').textContent='';
  if(LOCAL) return;
  const provider=new fb.GoogleAuthProvider();
  try{await fb.signInWithPopup(auth,provider)}
  catch(err){
    if(err.code==='auth/popup-blocked'||err.code==='auth/operation-not-supported-in-this-environment'){
      try{await fb.signInWithRedirect(auth,provider);return}catch(e2){err=e2}
    }
    const hint=err.code==='auth/unauthorized-domain'?' (firebase > authentication > ayarlar > yetkili alan adları: github.io adresini ekle)':'';
    if(err.code!=='auth/popup-closed-by-user') $('#lmsg').textContent='giriş yapılamadı: '+err.code+hint;
  }
}
function doLogout(){
  if(LOCAL) return;
  fb.signOut(auth);
}
boot();
</script>
